<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HR Management - About</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="/eyadWork/css/dashBoard.css">
</head>

<body>

<div class="dashboard">

    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar">

        <div class="logo-section">
            <div class="logo">HR</div>

            <div>
                <h2>HR Management</h2>
                <span>SYSTEM</span>
            </div>
        </div>

        <p class="workspace-title">MY WORKSPACE</p>

        <nav class="navigation">

            <a href="#" class="nav-item">
                <i class="bi bi-grid"></i>
                <span>Dashboard</span>
            </a>

            <a href="#" class="nav-item">
                <i class="bi bi-person"></i>
                <span>My Profile</span>
            </a>

            <a href="#" class="nav-item" onclick="displayEmployees()">
                <i class="bi bi-people"></i>
                <span>Employees</span>
            </a>

            <a href="#" class="nav-item">
                <i class="bi bi-clipboard"></i>
                <span>My Tasks</span>
            </a>

            <a href="#" class="nav-item">
                <i class="bi bi-calendar3"></i>
                <span>Leave Requests</span>
            </a>

            <a href="#" class="nav-item">
                <i class="bi bi-file-earmark-text"></i>
                <span>Policies</span>
            </a>

            <button href="#" class="nav-item" onclick="displayFeedback()">
                <i class="bi bi-chat-square"></i>
                <span>Feedback</span>
            </button>

            <a href="#" class="nav-item">
                <i class="bi bi-camera-video"></i>
                <span>Meetings</span>
            </a>

        </nav>

        <div class="sidebar-bottom">

            <a href="#" class="nav-item active">
                <i class="bi bi-info-circle"></i>
                <span>About</span>
            </a>

            <a href="#" class="nav-item">
                <i class="bi bi-envelope"></i>
                <span>Contact Us</span>
            </a>

            <a href="#" class="nav-item">
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
            </a>

        </div>

    </aside>


    <!-- ================= MAIN ================= -->
    <main class="main">

        <!-- HEADER -->
        <header class="header">



            <div class="user-profile">

                <div class="user-avatar">
                    LO
                </div>

                <div class="user-info">
                    <strong>Lujain Okour</strong>
                    <span>Employee</span>
                </div>

                

            </div>

        </header>


        <!-- CONTENT -->
        <section id="content">


        </section>

    </main>

</div>
<script src="/sara-work/js/feedback.js"></script>
</body>
</html>
